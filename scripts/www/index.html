<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>随机字符串生成器</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>随机字符串生成器</h1>
        </header>
        
        <div class="tabs">
            <button class="tab active" data-tab="random">随机字符串</button>
            <button class="tab" data-tab="filename">文件名生成器</button>
        </div>

        <main>
            <!-- 随机字符串生成器 -->
            <div id="random-tab" class="tab-content active">
                <div class="section">
                    <h3>选择段数：</h3>
                    <div class="checkbox-group">
                        <label><input type="checkbox" name="segments" value="2"> 2段</label>
                        <label><input type="checkbox" name="segments" value="3"> 3段</label>
                        <label><input type="checkbox" name="segments" value="4"> 4段</label>
                        <label><input type="checkbox" name="segments" value="5"> 5段</label>
                    </div>
                </div>

                <div class="section">
                    <h3>每段长度范围：</h3>
                    <input type="text" id="rangeInput" placeholder="例如：3-8" value="3-8">
                </div>

                <div class="section">
                    <div class="button-group">
                        <button id="generateBtn">生成</button>
                        <button id="copyBtn">复制</button>
                    </div>
                </div>

                <div class="section">
                    <h3>生成结果：</h3>
                    <textarea id="resultText" readonly></textarea>
                </div>
            </div>

            <!-- 文件名生成器 -->
            <div id="filename-tab" class="tab-content">
                <div class="section">
                    <h3>前缀管理：</h3>
                    <div class="prefix-input-group">
                        <input type="text" id="prefixInput" placeholder="输入前缀名称">
                        <button id="addPrefixBtn">添加</button>
                    </div>
                    <div class="prefix-list" id="prefixList"></div>
                </div>

                <div class="section">
                    <h3>文件后缀：</h3>
                    <input type="text" class="suffix-input" id="suffixInput" placeholder="例如：txt" value="txt">
                </div>

                <div class="section">
                    <h3>起始序号：</h3>
                    <input type="number" class="suffix-input" id="counterInput" placeholder="序号" value="1" min="0">
                </div>

                <div class="section">
                    <div class="button-group">
                        <button id="generateFilenameBtn">生成</button>
                        <button id="copyFilenameBtn">复制</button>
                    </div>
                </div>

                <div class="section">
                    <h3>生成结果：</h3>
                    <textarea id="filenameResultText" readonly></textarea>
                </div>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
